[pytest]
testpaths = tests
pythonpath = .
# `integration` is deselected by default because it needs Redpanda, LocalStack and
# a live producer/consumer pair, which is far too heavy for every push. An explicit
# `pytest -m integration` on the command line overrides this, since the last -m wins.
addopts = -q -m "not integration"
markers =
    integration: requires the full Docker Compose streaming stack (Redpanda, LocalStack, workers)
