[tool.ruff]
line-length = 100
target-version = "py311"
# spike_sumo.py is a standalone manual spike: a single script run by hand against a
# local SUMO install to answer a specific integration question, not library code.
# It predates the 100-char limit and is excluded rather than reformatted, since
# reflowing it would obscure the output it was written to read.
exclude = ["spike_sumo.py"]

[tool.ruff.lint]
# Matches the toolchain described in AGENTS.md: Black, isort and flake8.
# pyupgrade and bugbear are deliberately not enabled: bugbear's B008 in
# particular fires on FastAPI's Depends()/Query() argument defaults, which are
# the framework's documented idiom rather than a defect.
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# alembic injects the project root onto sys.path before importing, so its
# imports are intentionally not at the top of the file
"alembic/env.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "scenario_gen", "simulation", "evaluation", "streaming", "dashboard"]

# Phase 2.6. Non-blocking by design: the suite is not annotated to mypy --strict
# yet, and turning that on before the annotations exist would bury real findings
# under thousands of implicit-Any reports. The goal is a baseline that stops
# getting worse, with the strictness ratcheted up as each module is touched.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# `streaming/` and `dashboard/` still have unannotated callables; excluding them
# keeps the signal-to-noise ratio usable while the rest is migrated.
exclude = ["spike_sumo\\.py", "^streaming/", "^dashboard/"]
